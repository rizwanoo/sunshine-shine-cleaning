<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cyanSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.5" />

  <!-- Ambient Blue/Cyan Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#sunGlow)" />

  <!-- Radiating Sun Rays (Rotating 8 Points) -->
  <g transform="translate(256, 256)">
    <g stroke="url(#sunGrad)" stroke-width="14" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-175" x2="0" y2="-130" />
      <line x1="124" y1="-124" x2="92" y2="-92" />
      <line x1="175" y1="0" x2="130" y2="0" />
      <line x1="124" y1="124" x2="92" y2="92" />
      <line x1="0" y1="175" x2="0" y2="130" />
      <line x1="-124" y1="124" x2="-92" y2="92" />
      <line x1="-175" y1="0" x2="-130" y2="0" />
      <line x1="-124" y1="-124" x2="-92" y2="-92" />
    </g>
  </g>

  <!-- Golden Core Sun Body -->
  <circle cx="256" cy="256" r="82" fill="url(#sunGrad)" filter="url(#glow)" />

  <!-- Diamond Clean Sparkle Top-Right -->
  <path d="M 370 120 Q 370 160 410 160 Q 370 160 370 200 Q 370 160 330 160 Q 370 160 370 120 Z" fill="url(#cyanSpark)" />
  <circle cx="370" cy="160" r="6" fill="#ffffff" />

  <!-- Diamond Clean Sparkle Small Bottom-Left -->
  <path d="M 140 340 Q 140 365 165 365 Q 140 365 140 390 Q 140 365 115 365 Q 140 365 140 340 Z" fill="#38bdf8" />

  <!-- Specular Reflection Wave / Bubble Swoosh across Core -->
  <path d="M 215 205 C 240 185 285 190 295 210 C 275 205 240 215 225 235 Z" fill="#ffffff" opacity="0.85" />
</svg>
